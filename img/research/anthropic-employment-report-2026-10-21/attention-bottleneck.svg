<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="wait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="620" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1100" height="74" fill="url(#hdr)"/>
  <text x="36" y="34" fill="#ffffff" font-size="21" font-weight="700">瓶颈从模型转移到了人</text>
  <text x="36" y="58" fill="#9ca3af" font-size="13">多 agent 并行时代 · Anthropic 内部统计 · Datawhale 转载</text>

  <!-- 80% waiting bar -->
  <text x="40" y="116" fill="#111827" font-size="16" font-weight="700">多轮日常对话中，AI 处于「等人类回应」的时间占比</text>

  <rect x="40" y="132" width="1020" height="62" rx="8" fill="#e5e7eb"/>
  <rect x="40" y="132" width="816" height="62" rx="8" fill="url(#wait)"/>
  <text x="448" y="171" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">80%</text>
  <text x="880" y="171" fill="#6b7280" font-size="14" text-anchor="middle">20% AI 在干活</text>

  <text x="40" y="222" fill="#4b5563" font-size="13.5">几个任务同时完成、几份方案等你审阅、一段代码等你确认 —— 瓶颈不在算力，在注意力。</text>

  <!-- meta work -->
  <line x1="40" y1="252" x2="1060" y2="252" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="288" fill="#111827" font-size="16" font-weight="700">「元工作」交互占日常交互的比例</text>
  <text x="40" y="310" fill="#9ca3af" font-size="12.5">给 AI 写规范、搭监控、调流程 —— 让它少出错、少来回找人确认</text>

  <line x1="180" y1="490" x2="180" y2="344" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="180" y1="490" x2="960" y2="490" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="180" y1="441" x2="960" y2="441"/>
    <line x1="180" y1="393" x2="960" y2="393"/>
    <line x1="180" y1="344" x2="960" y2="344"/>
  </g>
  <g fill="#9ca3af" font-size="11" text-anchor="end">
    <text x="172" y="494">0%</text>
    <text x="172" y="445">10%</text>
    <text x="172" y="397">20%</text>
    <text x="172" y="348">30%</text>
  </g>

  <!-- 30% = 146px -->
  <rect x="290" y="464" width="110" height="26" rx="4" fill="url(#g1)"/>
  <text x="345" y="455" fill="#64748b" font-size="16" font-weight="700" text-anchor="middle">10%</text>
  <text x="345" y="512" fill="#4b5563" font-size="12.5" text-anchor="middle">一年前</text>

  <rect x="600" y="417" width="110" height="73" rx="4" fill="url(#g2)"/>
  <text x="655" y="408" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle">22%</text>
  <text x="655" y="512" fill="#4b5563" font-size="12.5" text-anchor="middle">现在（全公司）</text>

  <rect x="860" y="344" width="100" height="146" rx="4" fill="url(#g3)"/>
  <text x="910" y="335" fill="#1d4ed8" font-size="16" font-weight="700" text-anchor="middle">≈30%</text>
  <text x="910" y="512" fill="#4b5563" font-size="12.5" text-anchor="middle">基础设施团队</text>

  <!-- reading load -->
  <rect x="40" y="536" width="1020" height="62" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="562" fill="#4b5563" font-size="13">研发岗逐字读完 AI 产出的时间</text>
  <text x="64" y="588" fill="#c8102e" font-size="18" font-weight="700">平均每人每周 424 小时 ≈ 10 个人全职阅读一整周</text>
  <text x="660" y="562" fill="#6b7280" font-size="12.5">财务 / 法务等非技术部门</text>
  <text x="660" y="588" fill="#4b5563" font-size="14" font-weight="600">也要花掉大半个工作周</text>
</svg>