<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="660" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1100" height="74" fill="url(#hdr)"/>
  <text x="36" y="34" fill="#ffffff" font-size="21" font-weight="700">AI 接走了多少工作</text>
  <text x="36" y="58" fill="#9ca3af" font-size="13">Anthropic 内部统计 · 2026-10-21 · Datawhale 转载</text>

  <!-- Chart 1: AI agent runtime multiplier -->
  <text x="40" y="118" fill="#111827" font-size="16" font-weight="700">人均 AI agent 累计运行时长 ÷ 自身工时</text>

  <line x1="180" y1="340" x2="180" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="180" y1="340" x2="960" y2="340" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="180" y1="299" x2="960" y2="299"/>
    <line x1="180" y1="258" x2="960" y2="258"/>
    <line x1="180" y1="217" x2="960" y2="217"/>
    <line x1="180" y1="176" x2="960" y2="176"/>
  </g>
  <g fill="#9ca3af" font-size="11" text-anchor="end">
    <text x="172" y="344">0×</text>
    <text x="172" y="303">5×</text>
    <text x="172" y="262">10×</text>
    <text x="172" y="221">15×</text>
    <text x="172" y="180">20×</text>
  </g>

  <!-- bars: scale = 6 -> 57px/unit, 19 -> 171px -->
  <rect x="290" y="283" width="110" height="57" rx="4" fill="url(#bar)"/>
  <text x="345" y="274" fill="#2563eb" font-size="19" font-weight="700" text-anchor="middle">6×</text>
  <text x="345" y="362" fill="#4b5563" font-size="12.5" text-anchor="middle">全公司平均</text>

  <rect x="600" y="169" width="110" height="171" rx="4" fill="url(#barHot)"/>
  <text x="655" y="160" fill="#c8102e" font-size="19" font-weight="700" text-anchor="middle">19×</text>
  <text x="655" y="362" fill="#4b5563" font-size="12.5" text-anchor="middle">核心研究部门</text>

  <!-- section 2: code output -->
  <line x1="40" y1="400" x2="1060" y2="400" stroke="#e5e7eb" stroke-width="2"/>

  <text x="40" y="436" fill="#111827" font-size="16" font-weight="700">产出变化（相对半年前）</text>

  <rect x="40" y="456" width="480" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="486" fill="#4b5563" font-size="13">工程师人均代码提交量</text>
  <text x="64" y="516" fill="#2563eb" font-size="26" font-weight="700">5×</text>

  <rect x="548" y="456" width="480" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="572" y="486" fill="#4b5563" font-size="13">管理者亲自编写的代码量</text>
  <text x="572" y="516" fill="#2563eb" font-size="26" font-weight="700">2×</text>

  <!-- quality: no significant difference -->
  <rect x="40" y="550" width="988" height="86" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="64" y="578" fill="#111827" font-size="14.5" font-weight="700">质量对比：手写 vs AI 生成（同一人、同月内）</text>
  <text x="64" y="604" fill="#4b5563" font-size="13">提交后 90 天内因修复被删的代码行占比 · 代码被显式撤回的比例 · 跳过测试的标记数量</text>
  <text x="64" y="626" fill="#0a7c3e" font-size="13.5" font-weight="700">三项均无统计显著差异 —— 产出上去了，质量没掉。</text>
</svg>