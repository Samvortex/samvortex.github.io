<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="8 tasks results: 7 improved + 1 new architecture">
  <title>8 个任务结果概览：7 改进 + 1 新架构</title>
  <defs>
    <style>
      .t-title  { font: 600 18px ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .t-axis   { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #5b6475; }
      .t-num    { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .t-name   { font: 600 13px ui-sans-serif, system-ui, "PingFang SC", sans-serif; fill: #172033; }
      .t-domain { font: 400 11px ui-sans-serif, system-ui, "PingFang SC", sans-serif; fill: #5b6475; }
      .t-stat   { font: 500 11px ui-sans-serif, system-ui, "PingFang SC", sans-serif; fill: #172033; }
      .t-detail { font: 400 12px ui-sans-serif, system-ui, "PingFang SC", sans-serif; fill: #5b6475; }
    </style>
  </defs>

  <!-- Title -->
  <text x="40" y="34" class="t-title">8 个任务结果：7 个超越 SOTA + 1 个新算法架构</text>
  <text x="40" y="54" class="t-detail">arXiv 2610.22367 · 跨 5 大领域：numerical / chemistry / optimization / simulation / number theory</text>

  <!-- Section labels -->
  <text x="40" y="100" class="t-title" font-size="14" fill="#6BCB77">✓ 7 个任务：显著降低 Toffoli + qubit 数</text>
  <text x="40" y="280" class="t-title" font-size="14" fill="#f59e0b">★ 1 个任务：发现全新可逆算法架构</text>

  <!-- 7 improvement tasks (2 rows × 4, but 3+4 actually) -->
  <!-- Row 1: 4 tasks -->
  <g>
    <!-- Task 1: numerical -->
    <g>
      <rect x="40" y="115" width="200" height="80" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="40" y="115" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="58" y="138" text-anchor="middle" class="t-num">1</text>
      <text x="86" y="138" class="t-name">数值计算</text>
      <text x="50" y="160" class="t-domain">domain: numerical</text>
      <text x="50" y="180" class="t-stat">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- Task 2: chemistry -->
    <g>
      <rect x="260" y="115" width="200" height="80" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="260" y="115" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="278" y="138" text-anchor="middle" class="t-num">2</text>
      <text x="306" y="138" class="t-name">化学模拟</text>
      <text x="270" y="160" class="t-domain">domain: chemistry</text>
      <text x="270" y="180" class="t-stat">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- Task 3: optimization -->
    <g>
      <rect x="480" y="115" width="200" height="80" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="480" y="115" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="498" y="138" text-anchor="middle" class="t-num">3</text>
      <text x="526" y="138" class="t-name">优化</text>
      <text x="490" y="160" class="t-domain">domain: optimization</text>
      <text x="490" y="180" class="t-stat">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- Task 4: simulation -->
    <g>
      <rect x="700" y="115" width="200" height="80" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="700" y="115" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="718" y="138" text-anchor="middle" class="t-num">4</text>
      <text x="746" y="138" class="t-name">量子模拟</text>
      <text x="710" y="160" class="t-domain">domain: simulation</text>
      <text x="710" y="180" class="t-stat">↓ Toffoli &amp; qubit</text>
    </g>
  </g>

  <!-- Row 2: 3 tasks (with empty space for the 8th) -->
  <g>
    <!-- Task 5: number theory -->
    <g>
      <rect x="40" y="210" width="200" height="60" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="40" y="210" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="58" y="233" text-anchor="middle" class="t-num">5</text>
      <text x="86" y="233" class="t-name">数论（部分）</text>
      <text x="50" y="255" class="t-domain">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- Task 6: chemistry 2 -->
    <g>
      <rect x="260" y="210" width="200" height="60" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="260" y="210" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="278" y="233" text-anchor="middle" class="t-num">6</text>
      <text x="306" y="233" class="t-name">化学（又 1 项）</text>
      <text x="270" y="255" class="t-domain">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- Task 7: optimization 2 -->
    <g>
      <rect x="480" y="210" width="200" height="60" rx="8" fill="#dcfce7" stroke="#6BCB77" stroke-width="1.5" />
      <rect x="480" y="210" width="36" height="32" rx="8" fill="#6BCB77" />
      <text x="498" y="233" text-anchor="middle" class="t-num">7</text>
      <text x="526" y="233" class="t-name">优化（又 1 项）</text>
      <text x="490" y="255" class="t-domain">↓ Toffoli &amp; qubit</text>
    </g>

    <!-- "?" placeholder for the 8th (separated visually) -->
    <g>
      <rect x="700" y="210" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" />
      <text x="800" y="248" text-anchor="middle" class="t-detail" font-style="italic" fill="#94a3b8">8 个任务中前 7 个 ↑</text>
    </g>
  </g>

  <!-- 8th task: NEW ARCHITECTURE -->
  <g>
    <rect x="40" y="295" width="860" height="180" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" />
    <rect x="40" y="295" width="80" height="180" rx="10" fill="#f59e0b" />
    <text x="80" y="345" text-anchor="middle" class="t-num">8</text>
    <text x="80" y="365" text-anchor="middle" class="t-domain" fill="#fef3c7">★</text>
    <text x="80" y="395" text-anchor="middle" class="t-domain" fill="#fef3c7" font-weight="600">NEW</text>

    <text x="140" y="320" class="t-name" font-size="15">★ 素数域模逆元（prime-field modular inversion）</text>
    <text x="140" y="342" class="t-domain">domain: number theory · 大整数算术的关键操作</text>

    <g transform="translate(140, 360)">
      <text x="0" y="0" class="t-detail" font-weight="600" fill="#172033">⭐ 这不是"更好"，是"新的"：</text>
      <text x="0" y="22" class="t-detail">• 找到一种新的可逆架构，让 divsteps 算法（之前对可逆计算不实用）变得可行</text>
      <text x="0" y="42" class="t-detail">• 显著改善模逆元的 Toffoli × qubit 权衡</text>
      <text x="0" y="62" class="t-detail">• 应用：椭圆曲线密码学、Shor 算法等需要大整数模运算的场合</text>
      <text x="0" y="82" class="t-detail">• 论文原话："makes divsteps viable for reversible integer arithmetic"</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 500)">
    <text x="0" y="0" class="t-title" font-size="13">⭐ 关键观察：8 个里 7 个是"优化"，1 个是"创新"——AI 不仅压常数，还提出新结构</text>
  </g>
</svg>
